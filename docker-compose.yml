version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: aiverifysnap-db
    environment:
      POSTGRES_DB: aiverifysnap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiverifysnap-network

  ml-service:
    build:
      context: ./ML_Service
      dockerfile: Dockerfile
    container_name: aiverifysnap-ml
    environment:
      - PORT=8000
      - SERP_API_KEY=${SERP_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - aiverifysnap-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiverifysnap-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/aiverifysnap?sslmode=disable
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_dev_pwd}
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - aiverifysnap-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiverifysnap-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aiverifysnap-network

volumes:
  pgdata:

networks:
  aiverifysnap-network:
    driver: bridge
